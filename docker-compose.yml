services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: eduplatform-marketplace

    networks:
      - app

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d eduplatform-marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    networks:
      - app

    depends_on:
      postgres:
        condition: service_healthy

    command: ["npx", "prisma", "migrate", "deploy"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    env_file:
      - .env.docker

    networks:
      - app

    ports:
      - "5000:5000"

    depends_on:
      migrator:
        condition: service_completed_successfully

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
    driver: local
