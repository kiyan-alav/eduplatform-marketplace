components:
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: Page number
      schema:
        type: integer
        minimum: 1
        default: 1

    Limit:
      name: limit
      in: query
      required: false
      description: Page size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10

    Sort:
      name: sort
      in: query
      required: false
      description: Sort expression
      schema:
        type: string
        default: -createdAt

    Id:
      name: id
      in: path
      required: true
      description: MongoDB ObjectId
      schema:
        type: string
