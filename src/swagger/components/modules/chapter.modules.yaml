paths:
  /chapter/list:
    get:
      tags:
        - Chapter
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - name: title
          in: query
          schema:
            type: string
        - name: course
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /chapter/{id}:
    get:
      tags:
        - Chapter
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/NotFound"

  /instructor/chapter/list:
    get:
      tags:
        - Instructor Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - name: title
          in: query
          schema:
            type: string
        - name: course
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/UnAuthorized"

  /instructor/chapter/{id}:
    get:
      tags:
        - Instructor Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "401":
          $ref: "#/components/responses/UnAuthorized"

    put:
      tags:
        - Instructor Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChapter"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "400":
          $ref: "#/components/responses/BadRequest"

    delete:
      tags:
        - Instructor Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        "404":
          $ref: "#/components/responses/NotFound"

  /instructor/chapter:
    post:
      tags:
        - Instructor Chapter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChapter"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"

  /admin/chapter/list:
    get:
      tags:
        - Admin Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Sort"
        - name: title
          in: query
          schema:
            type: string
        - name: course
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /admin/chapter/{id}:
    get:
      tags:
        - Admin Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"

    put:
      tags:
        - Admin Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateChapter"
      responses:
        "200":
          $ref: "#/components/responses/Success"

    delete:
      tags:
        - Admin Chapter
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/Success"

  /admin/chapter:
    post:
      tags:
        - Admin Chapter
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChapter"
      responses:
        "201":
          $ref: "#/components/responses/Created"
        "400":
          $ref: "#/components/responses/BadRequest"
